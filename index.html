<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Republic Analyzer</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        .ai-content h3 { font-size: 1.125rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: #4f46e5; }
        .dark .ai-content h3 { color: #818cf8; }
        .ai-content p { margin-bottom: 0.75rem; line-height: 1.5; }
        .ai-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
        .ai-content li { margin-bottom: 0.25rem; }
        .ai-content strong { font-weight: 600; color: #1e293b; }
        .dark .ai-content strong { color: #e2e8f0; }

        /* Toggle Switch CSS */
        .toggle-checkbox:checked { right: 0; border-color: #68D391; }
        .toggle-checkbox:checked + .toggle-label { background-color: #68D391; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- GEMINI API INTEGRATION ---
        const fetchGemini = async (prompt, systemInstruction, useSearch = false, apiKey) => {
            if (!apiKey) throw new Error("Kein API Key in den Einstellungen hinterlegt.");
            
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            if (useSearch) {
                payload.tools = [{ google_search: {} }];
            }

            const delays = [1000, 2000, 4000, 8000, 16000];
            let lastError = null;

            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        if (response.status === 400 && errText.includes("API key not valid")) {
                            throw new Error("Der angegebene API Key ist ungültig.");
                        }
                        throw new Error(`HTTP Fehler! Status: ${response.status}`);
                    }

                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text || "Ich konnte leider keine Antwort generieren.";
                } catch (e) {
                    lastError = e;
                    if (e.message.includes("ungültig")) throw e; // Breche sofort ab, wenn Key falsch ist
                    if (i < 4) await new Promise(res => setTimeout(res, delays[i]));
                }
            }
            throw new Error("API Anfrage fehlgeschlagen: " + lastError.message);
        };

        // --- Parser ---
        const parseNumber = (val) => {
          if (!val) return 0;
          let str = String(val).trim();
          if (str.includes('.') && str.includes(',')) {
             if (str.lastIndexOf(',') > str.lastIndexOf('.')) {
                 str = str.replace(/\./g, '').replace(',', '.');
             } else {
                 str = str.replace(/,/g, '');
             }
          } else if (str.includes(',')) {
             str = str.replace(',', '.');
          }
          return parseFloat(str) || 0;
        };

        const parseCSV = (text) => {
          const lines = [];
          let currentLine = [];
          let currentVal = "";
          let inQuotes = false;
          
          for (let i = 0; i < text.length; i++) {
            let char = text[i];
            if (char === '"' && text[i+1] === '"') {
              currentVal += '"'; i++;
            } else if (char === '"') {
              inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
              currentLine.push(currentVal);
              currentVal = "";
            } else if (char === '\n' && !inQuotes) {
              currentLine.push(currentVal);
              lines.push(currentLine);
              currentLine = [];
              currentVal = "";
            } else {
              if (char !== '\r') currentVal += char;
            }
          }
          if (currentLine.length > 0 || currentVal !== "") {
            currentLine.push(currentVal);
            lines.push(currentLine);
          }
          
          if (lines.length === 0) return [];
          const headers = lines[0].map(h => h.replace(/^\uFEFF/, '').trim().toLowerCase());
          const data = [];
          
          for (let i = 1; i < lines.length; i++) {
            if (lines[i].length < headers.length - 2) continue;
            const row = {};
            for (let j = 0; j < headers.length; j++) {
              row[headers[j]] = lines[i][j] ? lines[i][j].trim() : "";
            }
            data.push(row);
          }
          return data;
        };

        // --- Logic ---
        const processData = (transactions) => {
          const sorted = [...transactions]
            .filter(tx => tx.date || tx.datetime)
            .sort((a, b) => {
              const dateA = a.datetime ? new Date(a.datetime) : new Date(a.date);
              const dateB = b.datetime ? new Date(b.datetime) : new Date(b.date);
              return dateA - dateB;
            });

          let totalRealized = 0; 
          let totalDividends = 0;
          let totalFees = 0;
          let totalTaxes = 0;
          let totalInterest = 0;

          const yearly = {};
          const assets = {};
          const closedTrades = [];

          sorted.forEach(tx => {
            const year = tx.date ? tx.date.substring(0, 4) : 'Unbekannt';
            
            if (!yearly[year]) {
              yearly[year] = { realized: 0, dividends: 0, fees: 0, taxes: 0, interest: 0, invested: 0 };
            }

            const fee = Math.abs(parseNumber(tx.fee)); 
            const tax = Math.abs(parseNumber(tx.tax)); 
            const rawAmount = parseNumber(tx.amount);
            const tradeValue = Math.abs(rawAmount); 
            const shares = Math.abs(parseNumber(tx.shares));
            const price = parseNumber(tx.price);
            const isin = tx.symbol;
            const type = tx.type?.toUpperCase() || '';
            const category = tx.category?.toUpperCase() || '';

            if (type === 'TAX_OPTIMIZATION') {
              totalTaxes -= rawAmount; 
              yearly[year].taxes -= rawAmount;
              return; 
            }

            totalFees += fee;
            totalTaxes += tax;
            yearly[year].fees += fee;
            yearly[year].taxes += tax;

            if (isin) {
              if (!assets[isin]) {
                assets[isin] = { name: tx.name, isin, queue: [], realized: 0, dividends: 0, fees: 0, taxes: 0, currentShares: 0, totalInvested: 0 };
              }
              assets[isin].fees += fee;
              assets[isin].taxes += tax;
            }

            if (type === 'DIVIDEND') {
              totalDividends += tradeValue;
              yearly[year].dividends += tradeValue;
              if (isin) assets[isin].dividends += tradeValue;
              
            } else if (type.includes('INTEREST') || category.includes('INTEREST')) {
              totalInterest += tradeValue;
              yearly[year].interest += tradeValue;
              
            } else if (type === 'BUY' || category === 'SAVINGS_PLAN' || type.includes('TRANSFER') || type.includes('INBOUND')) {
              if (isin && shares > 0) {
                let cost = tradeValue;
                if (cost === 0 && price > 0) cost = shares * price; 
                
                const totalCost = cost + fee; 
                const unitPrice = totalCost / shares;
                
                assets[isin].queue.push({ shares, unitPrice, date: tx.date });
                assets[isin].currentShares += shares;
                assets[isin].totalInvested += totalCost;
                yearly[year].invested += totalCost;
              }
              
            } else if (type === 'SELL' || type === 'DERIVATIVE_EXERCISE' || type === 'REPAYMENT') {
              if (isin && shares > 0) {
                let sharesToSell = shares;
                let totalCostForSell = 0;
                let totalRevenueForSell = 0;
                let sharesSoldFromQueue = 0;
                let buyDates = new Set();
                
                const totalRevenue = tradeValue - fee; 
                const sellUnitPrice = totalRevenue / shares;
                
                while (sharesToSell > 0.000001 && assets[isin].queue.length > 0) {
                  let lot = assets[isin].queue[0];
                  let soldFromLot = Math.min(sharesToSell, lot.shares);
                  
                  let costOfLot = lot.unitPrice * soldFromLot;
                  totalCostForSell += costOfLot;
                  
                  let revenueFromLot = sellUnitPrice * soldFromLot;
                  totalRevenueForSell += revenueFromLot;
                  
                  sharesSoldFromQueue += soldFromLot;
                  buyDates.add(lot.date);
                  
                  lot.shares -= soldFromLot;
                  sharesToSell -= soldFromLot;
                  
                  if (lot.shares <= 0.000001) {
                    assets[isin].queue.shift();
                  }
                }
                
                if (sharesSoldFromQueue > 0) {
                  let tradeProfitBeforeTax = totalRevenueForSell - totalCostForSell;
                  let tradeTax = tax; 
                  let tradeProfitAfterTax = tradeProfitBeforeTax - tradeTax;

                  let datesArr = Array.from(buyDates).sort();
                  let buyDateStr = datesArr.length > 1 ? `${datesArr[0]} ... ${datesArr[datesArr.length-1]}` : datesArr[0];

                  closedTrades.push({
                    id: tx.transaction_id || Math.random().toString(),
                    isin: tx.symbol,
                    name: tx.name,
                    buyDate: buyDateStr,
                    sellDate: tx.date,
                    shares: sharesSoldFromQueue,
                    totalCost: totalCostForSell,
                    totalRevenue: totalRevenueForSell,
                    profitBeforeTax: tradeProfitBeforeTax,
                    taxPaid: tradeTax,
                    profitAfterTax: tradeProfitAfterTax,
                    isOrphan: false
                  });

                  totalRealized += tradeProfitBeforeTax;
                  yearly[year].realized += tradeProfitBeforeTax;
                  assets[isin].realized += tradeProfitBeforeTax;
                }
                
                if (sharesToSell > 0.000001) {
                  const orphanRevenue = sellUnitPrice * sharesToSell;
                  closedTrades.push({
                    id: (tx.transaction_id || Math.random().toString()) + '-orphan',
                    isin: tx.symbol,
                    name: tx.name,
                    buyDate: 'Fehlt in CSV',
                    sellDate: tx.date,
                    shares: sharesToSell,
                    totalCost: orphanRevenue, 
                    totalRevenue: orphanRevenue,
                    profitBeforeTax: 0,
                    taxPaid: tax,
                    profitAfterTax: -tax,
                    isOrphan: true
                  });
                }

                assets[isin].currentShares = Math.max(0, assets[isin].currentShares - shares);
              }
            }
          });

          closedTrades.sort((a, b) => new Date(b.sellDate) - new Date(a.sellDate));

          return { totalRealized, totalDividends, totalFees, totalTaxes, totalInterest, yearly, assets, closedTrades, raw: transactions };
        };

        const formatEur = (num) => {
          return new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' }).format(num || 0);
        };

        // --- Modals ---
        function AiModal({ isOpen, onClose, title, content, isLoading }) {
            if (!isOpen) return null;
            
            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center bg-gradient-to-r from-purple-500/10 to-indigo-500/10">
                            <h2 className="text-xl font-bold flex items-center gap-2">
                                <span className="text-purple-600 dark:text-purple-400">✨</span> {title}
                            </h2>
                            <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                                <i className="fa-solid fa-xmark text-xl"></i>
                            </button>
                        </div>
                        <div className="p-6 overflow-y-auto">
                            {isLoading ? (
                                <div className="flex flex-col items-center justify-center py-12 text-slate-500">
                                    <i className="fa-solid fa-circle-notch fa-spin text-4xl text-purple-500 mb-4"></i>
                                    <p>KI analysiert Daten... das kann einen Moment dauern.</p>
                                </div>
                            ) : (
                                <div className="ai-content" dangerouslySetInnerHTML={{ __html: content }} />
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function SettingsModal({ isOpen, onClose, aiEnabled, setAiEnabled, apiKey, setApiKey }) {
            if (!isOpen) return null;

            const handleToggle = () => {
                const newVal = !aiEnabled;
                setAiEnabled(newVal);
                localStorage.setItem('tr_aiEnabled', newVal);
            };

            const handleApiKeyChange = (e) => {
                const val = e.target.value;
                setApiKey(val);
                localStorage.setItem('tr_apiKey', val);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col">
                        <div className="p-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
                            <h2 className="text-xl font-bold flex items-center gap-2">
                                <i className="fa-solid fa-gear text-slate-400"></i> Einstellungen
                            </h2>
                            <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
                                <i className="fa-solid fa-xmark text-xl"></i>
                            </button>
                        </div>
                        <div className="p-6 space-y-6">
                            
                            <div className="flex items-center justify-between">
                                <div>
                                    <h3 className="font-bold text-slate-800 dark:text-slate-200 text-base">KI-Features aktivieren</h3>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Schaltet Analysen via Google Gemini frei.</p>
                                </div>
                                <div className="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                    <input type="checkbox" name="toggle" id="toggle" checked={aiEnabled} onChange={handleToggle} className="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none cursor-pointer transition-transform duration-200 ease-in-out z-10 top-0 left-0" style={{ transform: aiEnabled ? 'translateX(100%)' : 'translateX(0)', borderColor: aiEnabled ? '#4f46e5' : '#cbd5e1' }}/>
                                    <label htmlFor="toggle" className="toggle-label block overflow-hidden h-5 rounded-full bg-slate-300 dark:bg-slate-600 cursor-pointer transition-colors duration-200 ease-in-out" style={{ backgroundColor: aiEnabled ? '#818cf8' : '' }}></label>
                                </div>
                            </div>

                            {aiEnabled && (
                                <div className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-200 dark:border-slate-700 space-y-4">
                                    <div>
                                        <label className="block text-sm font-bold mb-2">Google Gemini API Key</label>
                                        <input 
                                            type="password" 
                                            value={apiKey} 
                                            onChange={handleApiKeyChange}
                                            placeholder="AIzaSy..." 
                                            className="w-full px-4 py-2 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-purple-500"
                                        />
                                    </div>
                                    <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                                        Dein API Key wird <strong>nur lokal in deinem Browser gespeichert</strong>. Du kannst dir <a href="https://aistudio.google.com/app/apikey" target="_blank" className="text-blue-500 hover:underline">hier kostenlos einen Key generieren</a>.
                                    </p>
                                </div>
                            )}

                            <button onClick={onClose} className="w-full bg-slate-800 dark:bg-slate-700 hover:bg-slate-700 dark:hover:bg-slate-600 text-white font-bold py-2.5 px-4 rounded-lg transition-colors">
                                Schließen & Speichern
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- Main App ---
        function App() {
          const [data, setData] = useState(null);
          const [activeTab, setActiveTab] = useState('overview');
          
          // Settings States
          const [settingsOpen, setSettingsOpen] = useState(false);
          const [aiEnabled, setAiEnabled] = useState(() => localStorage.getItem('tr_aiEnabled') === 'true');
          const [apiKey, setApiKey] = useState(() => localStorage.getItem('tr_apiKey') || '');

          // AI Modal States
          const [aiModalOpen, setAiModalOpen] = useState(false);
          const [aiModalTitle, setAiModalTitle] = useState("");
          const [aiModalContent, setAiModalContent] = useState("");
          const [aiLoading, setAiLoading] = useState(false);

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (evt) => {
              const csvText = evt.target.result;
              const parsed = parseCSV(csvText);
              const processed = processData(parsed);
              setData(processed);
            };
            reader.readAsText(file);
          };

          const openAiCoach = async () => {
              if (!apiKey) {
                  setSettingsOpen(true);
                  return;
              }

              setAiModalTitle("Dein KI-Portfolio-Check");
              setAiModalOpen(true);
              setAiLoading(true);
              
              const netTotal = data.totalRealized + data.totalDividends + data.totalInterest - data.totalTaxes;
              const assetsArr = Object.values(data.assets).sort((a,b) => b.realized - a.realized);
              const top3 = assetsArr.slice(0,3).map(a => `${a.name} (+${formatEur(a.realized)})`).join(", ");
              const flop3 = assetsArr.slice(-3).reverse().map(a => `${a.name} (${formatEur(a.realized)})`).join(", ");

              const prompt = `Hier sind meine Portfolio-Daten: 
              Gesamt-Netto-Profit (Realisiert): ${formatEur(netTotal)}.
              Erhaltene Dividenden: ${formatEur(data.totalDividends)}.
              Erhaltene Zinsen: ${formatEur(data.totalInterest)}.
              Gezahlte Steuern: ${formatEur(data.totalTaxes)}.
              Meine Top 3 Assets nach Profit: ${top3}.
              Meine 3 Assets mit den höchsten realisierten Verlusten: ${flop3}.`;

              const sysInstruction = `Du bist ein freundlicher, motivierender und hochprofessioneller Trading-Coach. 
              Deine Aufgabe ist es, die übergebenen Trading-Daten (nackte Zahlen) des Nutzers zu interpretieren. 
              Lobe ihn für gute Dividendeneinnahmen oder starke Gewinner, tröste ihn bei Verlusten, und ziehe ein kurzes, knackiges Fazit zu seiner bisherigen Reise.
              WICHTIG: Du gibst KEINE Anlageberatung.
              WICHTIG: Antworte AUSSCHLIESSLICH in validem HTML (nutze <h3>, <p>, <ul>, <li>, <strong>). Nutze keine Markdown Fences (\`\`\`). Beginne direkt mit dem HTML-Code. Gestalte es visuell ansprechend strukturiert.`;

              try {
                  const result = await fetchGemini(prompt, sysInstruction, false, apiKey);
                  const cleanHtml = result.replace(/```html\n?/g, "").replace(/```\n?/g, "");
                  setAiModalContent(cleanHtml);
              } catch (err) {
                  setAiModalContent(`<div class="p-4 bg-red-100 text-red-700 rounded-lg"><strong>Fehler:</strong> ${err.message}</div>`);
              } finally {
                  setAiLoading(false);
              }
          };

          const openAssetInfo = async (asset) => {
              if (!apiKey) {
                  setSettingsOpen(true);
                  return;
              }

              setAiModalTitle(`Asset Check: ${asset.name}`);
              setAiModalOpen(true);
              setAiLoading(true);

              const prompt = `Analysiere bitte dieses Asset/Unternehmen: Name: ${asset.name}, ISIN: ${asset.isin}.`;

              const sysInstruction = `Du bist ein Finanzanalyst. Fasse in 2-3 Absätzen zusammen, was das angefragte Unternehmen/Asset macht (Geschäftsmodell, Sektor). 
              Nutze dann deine Websuche (Grounding), um 1-2 brandaktuelle News, Herausforderungen oder Chancen zu diesem Unternehmen zu nennen.
              WICHTIG: Antworte AUSSCHLIESSLICH in validem HTML (nutze <h3>, <p>, <ul>, <li>, <strong>). Nutze keine Markdown Fences (\`\`\`). Beginne direkt mit dem HTML-Code.`;

              try {
                  const result = await fetchGemini(prompt, sysInstruction, true, apiKey);
                  const cleanHtml = result.replace(/```html\n?/g, "").replace(/```\n?/g, "");
                  setAiModalContent(cleanHtml);
              } catch (err) {
                  setAiModalContent(`<div class="p-4 bg-red-100 text-red-700 rounded-lg"><strong>Fehler:</strong> ${err.message}</div>`);
              } finally {
                  setAiLoading(false);
              }
          };

          if (!data) {
            return (
              <div className="min-h-screen flex items-center justify-center p-4">
                <SettingsModal isOpen={settingsOpen} onClose={() => setSettingsOpen(false)} aiEnabled={aiEnabled} setAiEnabled={setAiEnabled} apiKey={apiKey} setApiKey={setApiKey} />
                
                <div className="max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-8 text-center border border-slate-200 dark:border-slate-700 relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-3 flex gap-2">
                     <button onClick={() => setSettingsOpen(true)} className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" title="Einstellungen">
                         <i className="fa-solid fa-gear"></i>
                     </button>
                  </div>
                  <div className="w-20 h-20 bg-blue-100 dark:bg-blue-900/30 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i className="fa-solid fa-building-columns text-blue-600 dark:text-blue-400 text-3xl"></i>
                  </div>
                  <h1 className="text-2xl font-bold mb-2">Trade Republic Analyzer</h1>
                  <p className="text-slate-500 dark:text-slate-400 mb-8 text-sm">
                    Lokal in deinem Browser. Deine CSV-Daten verlassen dieses Gerät niemals. {aiEnabled && <span><strong>KI-Funktionen</strong> sind aktiv.</span>}
                  </p>
                  <label className="cursor-pointer flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-blue-300 dark:border-blue-700 rounded-xl hover:bg-blue-50 dark:hover:bg-blue-900/20 transition-colors">
                    <i className="fa-solid fa-cloud-arrow-up text-blue-500 text-3xl mb-3"></i>
                    <span className="text-sm font-medium text-blue-600 dark:text-blue-400">CSV-Datei auswählen</span>
                    <input type="file" accept=".csv" className="hidden" onChange={handleFileUpload} />
                  </label>
                </div>
              </div>
            );
          }

          const tabs = [
            { id: 'overview', label: 'Übersicht', icon: 'fa-solid fa-chart-pie' },
            { id: 'trades', label: 'Verknüpfte Trades', icon: 'fa-solid fa-right-left' },
            { id: 'calendar', label: 'Kalender', icon: 'fa-regular fa-calendar-days' },
            { id: 'years', label: 'Jahre', icon: 'fa-regular fa-calendar' },
            { id: 'assets', label: aiEnabled ? 'Assets & News' : 'Assets', icon: 'fa-solid fa-arrow-trend-up' },
            { id: 'transactions', label: 'Alle Transaktionen', icon: 'fa-solid fa-list' }
          ];

          return (
            <div className="p-4 md:p-8 max-w-7xl mx-auto space-y-6">
              
              <SettingsModal isOpen={settingsOpen} onClose={() => setSettingsOpen(false)} aiEnabled={aiEnabled} setAiEnabled={setAiEnabled} apiKey={apiKey} setApiKey={setApiKey} />
              
              <AiModal 
                isOpen={aiModalOpen} 
                onClose={() => setAiModalOpen(false)} 
                title={aiModalTitle} 
                content={aiModalContent} 
                isLoading={aiLoading} 
              />

              <header className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                <div className="flex items-center gap-4">
                  <div className="p-3 bg-blue-100 dark:bg-blue-900/30 rounded-xl">
                    <i className="fa-solid fa-building-columns text-blue-600 dark:text-blue-400 text-xl"></i>
                  </div>
                  <div>
                    <h1 className="text-xl font-bold flex items-center gap-2">
                        Portfolio Analyse {aiEnabled && <span className="bg-purple-100 text-purple-700 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full">✨ AI Edition</span>}

              <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                {tabs.map(tab => (
                  <button

                      activeTab === tab.id

                    <i className={tab.icon + " w-4 h-4"}></i>
                    {tab.label}

                {activeTab === 'trades' && <MappedTradesTab trades={data.closedTrades} />}
                {activeTab === 'calendar' && <CalendarTab trades={data.closedTrades} />}
                {activeTab === 'years' && <YearsTab data={data} />}
                {activeTab === 'assets' && <AssetsTab data={data} openAssetInfo={openAssetInfo} aiEnabled={aiEnabled} />}
                {activeTab === 'transactions' && <TransactionsTab transactions={data.raw} />}
              </main>
            </div>
          );
        }

        // --- Tabs ---
        function OverviewTab({ data, openAiCoach, aiEnabled }) {
          const netTotal = data.totalRealized + data.totalDividends + data.totalInterest - data.totalTaxes; 

          return (
            <div className="space-y-6">
              {/* KI Banner nur anzeigen, wenn KI in den Einstellungen aktiviert ist */}
              {aiEnabled && (
                  <div className="bg-gradient-to-r from-purple-600 to-indigo-600 rounded-2xl shadow-sm p-6 text-white flex flex-col md:flex-row items-center justify-between gap-6">
                      <div>
                          <h2 className="text-xl font-bold mb-2 flex items-center gap-2">
                              <i className="fa-solid fa-robot"></i> Lass die KI über dein Depot schauen
                          </h2>
                          <p className="text-purple-100 text-sm max-w-2xl">
                              Gemini analysiert deine Top-Trades, deine Verluste und Dividenden und gibt dir ein individuelles, motivierendes Feedback zu deiner Performance.
                          </p>
                      </div>
                      <button 
                          onClick={openAiCoach}
                          className="shrink-0 bg-white text-purple-700 hover:bg-purple-50 font-bold py-3 px-6 rounded-xl shadow-lg transition-transform hover:scale-105 active:scale-95 flex items-center gap-2"
                      >
                          ✨ KI-Depot-Check starten
                      </button>
                  </div>
              )}

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <MetricCard 
                  title="Realisierter P/L (Vor Steuern)" 
                  value={data.totalRealized} 
                  icon={data.totalRealized >= 0 ? "fa-solid fa-arrow-trend-up" : "fa-solid fa-arrow-trend-down"} 
                  trend="Ordergebühren bereits abgezogen"
                />
                <MetricCard 
                  title="Dividenden (Brutto)" 
                  value={data.totalDividends} 
                  icon="fa-solid fa-arrow-down"
                  color="text-green-600 dark:text-green-400"
                  bg="bg-green-100 dark:bg-green-900/30"
                />
                <MetricCard 
                  title="Erhaltene Zinsen" 
                  value={data.totalInterest} 
                  icon="fa-solid fa-percent" 
                  color="text-teal-600 dark:text-teal-400"
                  bg="bg-teal-100 dark:bg-teal-900/30"
                />
                <MetricCard 
                  title="Gezahlte Steuern" 
                  value={-data.totalTaxes} 
                  icon="fa-solid fa-file-invoice-dollar" 
                  color="text-red-600 dark:text-red-400"
                  bg="bg-red-100 dark:bg-red-900/30"
                  trend="Inkl. Erstattungen"
                />
              </div>

              <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col md:flex-row items-center justify-between gap-6">
                <div>
                  <h2 className="text-lg font-medium text-slate-500 dark:text-slate-400 mb-1">Historisches Total Netto</h2>
                  <p className="text-sm text-slate-400 max-w-xl">
                    P/L + Dividenden + Zinsen - Steuern.<br/>
                    Buchverluste (Positionen, die noch im Depot liegen) sind hier nicht enthalten.
                  </p>
                </div>
                <div className={`text-4xl font-bold shrink-0 ${netTotal >= 0 ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-500'}`}>
                  {netTotal >= 0 ? '+' : ''}{formatEur(netTotal)}
                </div>
              </div>
            </div>
          );
        }

        function MappedTradesTab({ trades }) {
          const [searchTerm, setSearchTerm] = useState('');
          
          const filteredTrades = useMemo(() => {
            return trades.filter(t => 
              t.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
              t.isin.toLowerCase().includes(searchTerm.toLowerCase())
            );
          }, [trades, searchTerm]);

          return (
            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col h-[750px]">
              <div className="p-6 border-b border-slate-200 dark:border-slate-700 flex flex-col md:flex-row justify-between gap-4 shrink-0">
                <div>
                  <h2 className="text-lg font-bold">Abgeschlossene Trades</h2>
                  <p className="text-sm text-slate-500 flex items-center gap-1 mt-1">
                    <i className="fa-solid fa-circle-info text-blue-500"></i>
                    Zeigt Steuern pro Trade an für echten Netto-Profit.
                  </p>
                </div>
                <div className="relative w-full md:w-80">
                  <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  <input 
                    type="text" 
                    placeholder="Asset suchen..." 
                    className="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                  />
                </div>
              </div>

              <div className="overflow-auto flex-1 p-0">
                <table className="w-full text-sm text-left">
                  <thead className="text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50 uppercase sticky top-0 z-10 shadow-sm">
                    <tr>
                      <th className="px-6 py-4">Asset</th>
                      <th className="px-6 py-4">Kauf → Verkauf</th>
                      <th className="px-6 py-4 text-right">Profit (vor Steuern)</th>
                      <th className="px-6 py-4 text-right">Steuern</th>
                      <th className="px-6 py-4 text-right bg-blue-50 dark:bg-blue-900/10">Netto</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {filteredTrades.map((t) => (
                      <tr key={t.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                        <td className="px-6 py-3">
                          <div className="font-medium text-slate-900 dark:text-slate-100 max-w-[200px] truncate" title={t.name}>{t.name}</div>
                          <div className="text-xs text-slate-500 flex items-center gap-2">
                            {t.isin}
                            {t.isOrphan && (
                              <span className="flex items-center gap-1 text-red-500 bg-red-100 dark:bg-red-900/30 px-1.5 py-0.5 rounded" title="Keine Kauf-Historie im CSV gefunden.">
                                <i className="fa-solid fa-triangle-exclamation"></i> Historie fehlt
                              </span>
                            )}
                          </div>
                        </td>
                        <td className="px-6 py-3 text-slate-500 text-xs">
                          <div className="whitespace-nowrap">{t.buyDate}</div>
                          <i className="fa-solid fa-right-left text-slate-300 text-[10px] my-1"></i>
                          <div className="whitespace-nowrap">{t.sellDate}</div>
                        </td>
                        <td className="px-6 py-3 text-right text-slate-500">
                          {formatEur(t.profitBeforeTax)}
                        </td>
                        <td className="px-6 py-3 text-right text-red-500">
                          {t.taxPaid > 0 ? `-${formatEur(t.taxPaid)}` : formatEur(0)}
                        </td>
                        <td className={`px-6 py-3 text-right font-bold bg-blue-50/50 dark:bg-blue-900/5 ${t.profitAfterTax > 0 ? 'text-green-600 dark:text-green-400' : t.profitAfterTax < 0 ? 'text-red-600' : 'text-slate-500'}`}>
                          {formatEur(t.profitAfterTax)}
                        </td>
                      </tr>
                    ))}
                    {filteredTrades.length === 0 && (
                      <tr>
                        <td colSpan="5" className="px-6 py-12 text-center text-slate-500">Keine abgeschlossenen Trades gefunden.</td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        function CalendarTab({ trades }) {
          const [selectedYear, setSelectedYear] = useState('');

          const dailyData = useMemo(() => {
            const map = {};
            trades.forEach(t => {
              const dateMatch = t.sellDate.match(/^(\d{4})-(\d{2})-(\d{2})/);
              if (dateMatch) {
                const dateStr = dateMatch[0];
                if (!map[dateStr]) map[dateStr] = 0;
                map[dateStr] += t.profitAfterTax; 
              }
            });
            return map;
          }, [trades]);

          const availableYears = useMemo(() => {
            const years = new Set();
            Object.keys(dailyData).forEach(date => years.add(date.substring(0, 4)));
            if (years.size === 0) years.add(new Date().getFullYear().toString());
            return Array.from(years).sort((a, b) => b - a);
          }, [dailyData]);

          useEffect(() => {
            if (availableYears.length > 0 && !selectedYear) {
              setSelectedYear(availableYears[0]);
            }
          }, [availableYears, selectedYear]);

          const months = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
          const dayNames = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

          if (!selectedYear) return null;

          const formatSmallEur = (num) => {
            const rounded = Math.round(num);
            return rounded > 0 ? `+${rounded}€` : `${rounded}€`;
          };

          return (
            <div className="space-y-6">
              <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                  <h2 className="text-lg font-bold">Trading Kalender ({selectedYear})</h2>
                  <p className="text-sm text-slate-500">Tägliche Summe deiner Netto-Profite (nach Steuern & Gebühren). Hover über die Felder für Details.</p>
                </div>
                <select 
                  className="px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg font-bold focus:outline-none"
                  value={selectedYear}
                  onChange={(e) => setSelectedYear(e.target.value)}
                >
                  {availableYears.map(y => <option key={y} value={y}>{y}</option>)}
                </select>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                {months.map((monthName, monthIndex) => {
                  const yearNum = parseInt(selectedYear);
                  const daysInMonth = new Date(yearNum, monthIndex + 1, 0).getDate();
                  
                  let startDay = new Date(yearNum, monthIndex, 1).getDay();
                  startDay = startDay === 0 ? 6 : startDay - 1;

                  const blanks = Array.from({ length: startDay });
                  const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);

                  return (
                    <div key={monthIndex} className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                      <h3 className="font-bold text-center mb-3 text-slate-700 dark:text-slate-300">{monthName}</h3>
                      <div className="grid grid-cols-7 gap-1 text-center mb-1">
                        {dayNames.map(d => <div key={d} className="text-[10px] font-semibold text-slate-400">{d}</div>)}
                      </div>
                      <div className="grid grid-cols-7 gap-1">
                        {blanks.map((_, i) => <div key={`blank-${i}`} className="h-10"></div>)}
                        
                        {days.map(day => {
                          const dateStr = `${selectedYear}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                          const val = dailyData[dateStr];
                          
                          let bgClass = "bg-slate-50 dark:bg-slate-800/50";
                          let textClass = "text-slate-400 dark:text-slate-500";
                          let borderClass = "border-transparent";
                          let valDisplay = null;

                          if (val !== undefined) {
                            if (val > 0) {
                              bgClass = "bg-green-100 dark:bg-green-900/40";
                              textClass = "text-green-700 dark:text-green-400 font-bold";
                              borderClass = "border-green-300 dark:border-green-700";
                            } else if (val < 0) {
                              bgClass = "bg-red-100 dark:bg-red-900/40";
                              textClass = "text-red-700 dark:text-red-400 font-bold";
                              borderClass = "border-red-300 dark:border-red-700";
                            } else {
                              bgClass = "bg-slate-200 dark:bg-slate-700";
                              textClass = "text-slate-700 dark:text-slate-300 font-bold";
                              borderClass = "border-slate-300 dark:border-slate-600";
                            }
                            valDisplay = formatSmallEur(val);
                          }

                          return (
                            <div key={day} className={`h-10 flex flex-col items-center justify-center rounded border ${bgClass} ${borderClass} relative group cursor-default`}>
                              <span className={`text-[11px] leading-tight ${val !== undefined ? 'opacity-80' : ''}`}>{day}</span>
                              {valDisplay && <span className={`text-[9px] leading-none ${textClass}`}>{valDisplay}</span>}
                              
                              {val !== undefined && (
                                <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-1 px-2 py-1 bg-slate-900 text-white text-[11px] rounded opacity-0 group-hover:opacity-100 pointer-events-none whitespace-nowrap z-50 transition-opacity">
                                  {dateStr}: <span className={val > 0 ? 'text-green-400' : val < 0 ? 'text-red-400' : ''}>{formatEur(val)} Netto</span>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        function YearsTab({ data }) {
          const years = Object.keys(data.yearly).sort((a, b) => b - a);

          return (
            <div className="space-y-6">
              {years.map(year => {
                const yData = data.yearly[year];
                const yearNet = yData.realized + yData.dividends + yData.interest - yData.taxes;
                
                return (
                  <div key={year} className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
                    <div className="p-6 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-slate-50/50 dark:bg-slate-800/50">
                      <h2 className="text-2xl font-bold">{year}</h2>
                      <div className={`text-xl font-bold ${yearNet >= 0 ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-500'}`}>
                        {yearNet >= 0 ? '+' : ''}{formatEur(yearNet)} Netto
                      </div>
                    </div>
                    <div className="p-6 grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                      <div>
                        <p className="text-slate-500 dark:text-slate-400 mb-1">Realisierter P/L (vor Steuern)</p>
                        <p className={`font-semibold ${yData.realized >= 0 ? 'text-green-600 dark:text-green-400' : 'text-red-600'}`}>{formatEur(yData.realized)}</p>
                      </div>
                      <div>
                        <p className="text-slate-500 dark:text-slate-400 mb-1">Dividenden (Brutto)</p>
                        <p className="font-semibold text-green-600 dark:text-green-400">{formatEur(yData.dividends)}</p>
                      </div>
                      <div>
                        <p className="text-slate-500 dark:text-slate-400 mb-1">Zinsen (Brutto)</p>
                        <p className="font-semibold text-teal-600 dark:text-teal-400">{formatEur(yData.interest)}</p>
                      </div>
                      <div>
                        <p className="text-slate-500 dark:text-slate-400 mb-1">Gesamte Steuern (Jahreswert)</p>
                        <p className="font-semibold text-red-500">{formatEur(-yData.taxes)}</p>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          );
        }

        function AssetsTab({ data, openAssetInfo, aiEnabled }) {
          const [searchTerm, setSearchTerm] = useState('');
          const [sortBy, setSortBy] = useState('realized');

          const assetsList = useMemo(() => {
            return Object.entries(data.assets)
              .map(([isin, asset]) => ({
                isin,
                ...asset
              }))
              .filter(a => a.name.toLowerCase().includes(searchTerm.toLowerCase()) || a.isin.toLowerCase().includes(searchTerm.toLowerCase()))
              .sort((a, b) => b[sortBy] - a[sortBy]);
          }, [data.assets, searchTerm, sortBy]);

          return (
            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col h-[750px]">
              <div className="p-6 border-b border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row justify-between gap-4 shrink-0">
                <div className="relative max-w-sm w-full">
                  <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  <input 
                    type="text" 
                    placeholder="Asset oder ISIN suchen..." 
                    className="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                  />
                </div>
                <select 
                  className="px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none"
                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}
                >
                  <option value="realized">Nach P/L sortieren</option>
                  <option value="dividends">Nach Dividenden sortieren</option>
                  <option value="currentShares">Nach Bestand sortieren</option>
                </select>
              </div>

              <div className="overflow-auto flex-1 p-0">
                <table className="w-full text-sm text-left">
                  <thead className="text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50 uppercase sticky top-0 z-10 shadow-sm">
                    <tr>
                      <th className="px-6 py-4">Asset</th>
                      {aiEnabled && <th className="px-6 py-4 text-center">KI-Analyse</th>}
                      <th className="px-6 py-4 text-right">Realisierter P/L</th>
                      <th className="px-6 py-4 text-right">Dividenden</th>
                      <th className="px-6 py-4 text-right">Steuern</th>
                      <th className="px-6 py-4 text-right">Bestand</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {assetsList.map((asset) => (
                      <tr key={asset.isin} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                        <td className="px-6 py-3">
                          <div className="font-medium text-slate-900 dark:text-slate-100 max-w-[250px] truncate" title={asset.name}>{asset.name || 'Unbekannt'}</div>
                          <div className="text-xs text-slate-500">{asset.isin}</div>
                        </td>
                        {aiEnabled && (
                            <td className="px-6 py-3 text-center">
                              <button 
                                onClick={() => openAssetInfo(asset)}
                                className="bg-purple-100 text-purple-700 hover:bg-purple-200 dark:bg-purple-900/30 dark:text-purple-400 dark:hover:bg-purple-900/50 px-3 py-1.5 rounded text-xs font-bold transition-colors"
                                title="Aktuelle News & Infos zu diesem Asset via KI abrufen"
                              >
                                ✨ KI-News
                              </button>
                            </td>
                        )}
                        <td className={`px-6 py-3 text-right font-semibold ${asset.realized > 0 ? 'text-green-600 dark:text-green-400' : asset.realized < 0 ? 'text-red-600' : ''}`}>
                          {formatEur(asset.realized)}
                        </td>
                        <td className="px-6 py-3 text-right text-green-600 dark:text-green-400 font-medium">
                          {formatEur(asset.dividends)}
                        </td>
                        <td className="px-6 py-3 text-right text-red-500">
                          {formatEur(-asset.taxes)}
                        </td>
                        <td className="px-6 py-3 text-right">
                          {asset.currentShares > 0 ? (
                            <span className="px-2.5 py-1 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 rounded-md text-xs font-medium inline-block">
                              {asset.currentShares.toFixed(4).replace(/\.?0+$/, '')} Anteile
                            </span>
                          ) : (
                            <span className="text-slate-400">Aufgelöst</span>
                          )}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        function TransactionsTab({ transactions }) {
          const [filterType, setFilterType] = useState('ALL');
          const [searchTerm, setSearchTerm] = useState('');

          const types = ['ALL', ...new Set(transactions.map(t => t.type || t.category).filter(Boolean))];

          const filtered = useMemo(() => {
            return transactions.filter(t => {
              const matchType = filterType === 'ALL' || t.type === filterType || t.category === filterType;
              const searchStr = `${t.name} ${t.symbol} ${t.description}`.toLowerCase();
              const matchSearch = searchStr.includes(searchTerm.toLowerCase());
              return matchType && matchSearch;
            }).sort((a, b) => new Date(b.datetime || b.date) - new Date(a.datetime || a.date));
          }, [transactions, filterType, searchTerm]);

          return (
            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col h-[750px]">
              <div className="p-6 border-b border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row justify-between gap-4 shrink-0">
                <div className="relative w-full sm:w-96">
                  <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  <input 
                    type="text" 
                    placeholder="Suchen (Name, ISIN, Beschreibung)..." 
                    className="w-full pl-10 pr-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                  />
                </div>
                <div className="flex items-center gap-2">
                  <i className="fa-solid fa-filter text-slate-400"></i>
                  <select 
                    className="px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm focus:outline-none"
                    value={filterType}
                    onChange={(e) => setFilterType(e.target.value)}
                  >
                    {types.map(t => <option key={t} value={t}>{t === 'ALL' ? 'Alle Typen' : t}</option>)}
                  </select>
                </div>
              </div>

              <div className="overflow-auto flex-1 p-0">
                <table className="w-full text-sm text-left">
                  <thead className="text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-900/50 uppercase sticky top-0 z-10 shadow-sm">
                    <tr>
                      <th className="px-6 py-4">Datum/Zeit</th>
                      <th className="px-6 py-4">Typ</th>
                      <th className="px-6 py-4">Asset</th>
                      <th className="px-6 py-4 text-right">Cash-Flow</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                    {filtered.slice(0, 300).map((tx, idx) => ( 
                      <tr key={idx} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                        <td className="px-6 py-3 whitespace-nowrap text-slate-500 text-xs">
                          {tx.datetime ? tx.datetime.replace('T', ' ').substring(0, 16) : tx.date}
                        </td>
                        <td className="px-6 py-3">
                          <span className="px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded text-[10px] font-medium border border-slate-200 dark:border-slate-700 tracking-wider">
                            {tx.type || tx.category}
                          </span>
                        </td>
                        <td className="px-6 py-3">
                          <div className="font-medium truncate max-w-[250px]" title={tx.name || tx.description}>{tx.name || tx.description}</div>
                          {tx.symbol && <div className="text-xs text-slate-500">{tx.symbol}</div>}
                        </td>
                        <td className={`px-6 py-3 text-right font-medium ${parseFloat(tx.amount?.replace(',','.')) > 0 ? 'text-green-600 dark:text-green-400' : parseFloat(tx.amount?.replace(',','.')) < 0 ? 'text-slate-900 dark:text-slate-100' : 'text-slate-500'}`}>
                          {formatEur(parseNumber(tx.amount))}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {filtered.length > 300 && (
                  <div className="p-4 text-center text-sm text-slate-500 bg-slate-50 dark:bg-slate-900/50">
                    Zeigt die neuesten 300 von {filtered.length} Transaktionen.
                  </div>
                )}
              </div>
            </div>
          );
        }

        function MetricCard({ title, value, icon, color = "text-blue-600 dark:text-blue-400", bg = "bg-blue-100 dark:bg-blue-900/30", trend }) {
          const isNegative = value < 0;
          let displayColor = color;
          
          if (color === "text-blue-600 dark:text-blue-400") {
             if (isNegative) displayColor = "text-red-600 dark:text-red-500";
             else if (value > 0) displayColor = "text-green-600 dark:text-green-400";
          }

          return (
            <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col">
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-sm font-medium text-slate-500 dark:text-slate-400">{title}</h3>
                <div className={`p-2 rounded-lg ${bg} flex items-center justify-center w-10 h-10`}>
                  <i className={`${icon} ${color} text-lg`}></i>
                </div>
              </div>
              <div className={`text-2xl font-bold ${displayColor}`}>
                {formatEur(value)}
              </div>
              {trend && (
                <div className="mt-2 text-xs text-slate-400 flex items-center gap-1">
                  {trend}
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
